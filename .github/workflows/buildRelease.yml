name: Build Release

on:
  release:
    types: [created]
jobs:
  build:
    runs-on: xcode-27

    permissions:
      contents: write

    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: |
        swift build -c release --arch arm64 --arch x86_64
        # The universal build output moved from .build/apple to .build/out in Swift 6.4, so ask SwiftPM.
        echo "BIN_PATH=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)" >> "$GITHUB_ENV"

    - name: Create release artifact
      uses: actions/upload-artifact@v7
      with:
        name: xcresultparser
        path: ${{ env.BIN_PATH }}/xcresultparser
        if-no-files-found: error

    - name: Upload release asset
      uses: softprops/action-gh-release@v3
      with:
        files: ${{ env.BIN_PATH }}/xcresultparser
        fail_on_unmatched_files: true
