name: Swift

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }}, Xcode ${{ matrix.xcode }})

    strategy:
      fail-fast: false
      matrix:
        include:
          # Newest Xcode on the newest runner (macOS 27, currently a GitHub preview image).
          - os: xcode-27
            xcode: '27.2'
            # Only publish the binary built with the latest toolchain.
            upload-binary: true
          # Newest Xcode 26 on the runner in between.
          - os: macos-26
            xcode: '26.6'
          # Oldest supported Xcode (see Package.swift) on the oldest runner.
          - os: macos-15
            xcode: '26.0.1'

    runs-on: ${{ matrix.os }}

    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

    permissions:
      contents: read
      checks: write

    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: |
        swift build -c release --disable-sandbox --arch arm64 --arch x86_64
        # The universal build output moved from .build/apple to .build/out in Swift 6.4, so ask SwiftPM.
        echo "BIN_PATH=$(swift build -c release --disable-sandbox --arch arm64 --arch x86_64 --show-bin-path)" >> "$GITHUB_ENV"
    - name: Run tests
      run: |
        mkdir -p .build/test-results
        swift test -v --xunit-output .build/test-results/tests.xml --experimental-xunit-message-failure
    - name: Test report
      uses: dorny/test-reporter@v3
      if: always()
      with:
        name: Test Results (${{ matrix.os }}, Xcode ${{ matrix.xcode }})
        path: .build/test-results/tests-swift-testing.xml
        reporter: java-junit
    - uses: actions/upload-artifact@v7
      if: always()
      with:
          name: test-results-${{ matrix.os }}-xcode-${{ matrix.xcode }}
          path: .build/test-results/*.xml
          if-no-files-found: error
    - uses: actions/upload-artifact@v7
      if: matrix.upload-binary
      with:
          name: xcresultparser
          path: ${{ env.BIN_PATH }}/xcresultparser
          if-no-files-found: error
